name: TypeScript Type Check

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  type-check:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          path: metadatarr
      
      - name: Clone parse-torrent-title
        run: git clone https://github.com/QuixThe2nd/parse-torrent-title parse-torrent-title
        working-directory: /home/runner/work/metadatarr
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: metadatarr/package-lock.json
      
      - name: Install dependencies
        run: npm ci
        working-directory: metadatarr
      
      - name: Run TypeScript type check
        run: npx tsc --noEmit
        working-directory: metadatarr